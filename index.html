<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="models/level.class.js"></script>
    <script src="models/drawable-object.class.js"></script>
    <script src="models/sound-manager.class.js"></script>
    <script src="models/movable-object.class.js"></script>

    <script src="models/drawable_objects/movable_objects/character.class.js"></script>
    <script src="models/drawable_objects/movable_objects/chicken.class.js"></script>
    <script src="models/drawable_objects/movable_objects/chick.class.js"></script>
    <script src="models/drawable_objects/movable_objects/chick-jumping.class.js"></script>
    <script src="models/drawable_objects/movable_objects/chick-canon.js"></script>
    <script src="models/drawable_objects/movable_objects/clouds.class.js"></script>
    <script src="models/drawable_objects/movable_objects/endboss.class.js"></script>
    <script src="models/drawable_objects/movable_objects/background-objects.class.js"></script>
    <script src="models/drawable_objects/movable_objects/throwable-object.class.js"></script>
    <script src="models/drawable_objects/movable_objects/brokenBottle.class.js"></script>

    <script src="models/drawable_objects/user_interface/status-lifebar.class.js"></script>
    <script src="models/drawable_objects/user_interface/status-coinbar.class.js"></script>
    <script src="models/drawable_objects/user_interface/status-bottlebar.class.js"></script>

    <script src="models/drawable_objects/movable_objects/collectable_objects/coin.class.js"></script>
    <script src="models/drawable_objects/movable_objects/collectable_objects/collectableBottle.class.js"></script>

    <script src="models/collision-checker.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="models/keyboard.class.js"></script>

    <script src="levels/level1.js"></script>
    <script src="levels/level2.js"></script>

    <script src="js/templates.js" defer></script>
    <script src="js/menuControll.js" defer></script>
    <script src="js/sound-config.js" defer></script>
    <script src="js/pause-config.js" defer></script>
    <script src="js/keybindings.js" defer></script>
    <script src="js/game.js" defer></script>

    <link rel="stylesheet" href="style.css" />

    <title>El Polo Loco</title>
    <link rel="icon" type="image/x-icon" href="img/6_salsa_bottle/1_salsa_bottle_on_ground.png" />
  </head>
  <body>
    <canvas id="canvas" width="720" height="480"> </canvas>

    <!-- startscreen area -->
    <div id="startscreenContainer" class="startscreenContainer">
      <div class="commonScreen startscreenImage">
        <div class="buttonRow">
          <div class="commonButton startButton" onclick="startGame(), displayNone('startscreenContainer'), displayShow('ingameFullCanvasButtonContainer')"></div>
          <div class="commonButton introductionsButton" onclick="displayShow('textContainer'), renderText('introductionsTemplate')"></div>
          <div class="commonButton impressumButton" onclick="displayShow('textContainer'), renderText('impressumTemplate')"></div>
          <div class="commonButton controlsButton" onclick="displayShow('textContainer'), renderText('controlTemplate')"></div>
        </div>
      </div>
    </div>

    <!-- ingame button area -->
    <div id="ingameFullCanvasButtonContainer" class="ingameFullCanvasButtonContainer displayNone">
      <div class="ingameButtonContainer">
        <div id="mutedButton" class="mutedButton ingameButton displayNone" onclick="resumeSounds()"></div>
        <div id="soundOnButton" class="soundOnButton ingameButton" onclick="muteAllSounds()"></div>
        <div id="pauseButton" class="pauseButton ingameButton" onclick="pauseGame()"></div>
        <div id="playButton" class="playButton ingameButton displayNone" onclick="resumeGame()"></div>
        <div id="fullscreenButton" class="fullscreenButton ingameButton" onclick="toggleFullscreen()"></div>
      </div>
    </div>

    <!-- text area -->
    <div id="textContainer" class="textContainer displayNone">
      <div class="commonScreen">
        <div id="templateContent" style="text-align: center; max-height: 90%; color: white"></div>
        <div class="closeButtonBox">
          <div class="commonButton closeButton" onclick="displayNone('textContainer')"></div>
        </div>
      </div>
    </div>

    <!--ingame screens-->
    <div id="winningscreenContainer" class="winningscreenContainer displayNone">
      <div class="commonScreen winningscreenImage">
        <div class="buttonRow">
          <div id="nextLevelButton" class="commonButton nextLevelButton" onclick="displayNone('winningscreenContainer'), selectLevel()"></div>
          <div class="commonButton homeButton" onclick="displayNone('winningscreenContainer'), displayShow('startscreenContainer'), displayNone('ingameFullCanvasButtonContainer')"></div>
        </div>
      </div>
    </div>

    <div id="losingscreenContainer" class="losingscreenContainer displayNone">
      <div class="commonScreen losingscreenImage">
        <div class="buttonRow">
          <div class="commonButton restartButton" onclick="displayNone('losingscreenContainer'), restartLevel()"></div>
          <div class="commonButton homeButton" onclick="displayNone('losingscreenContainer'), displayShow('startscreenContainer'), displayNone('ingameFullCanvasButtonContainer')"></div>
        </div>
      </div>
    </div>

    <!-- <div id="orientation-warning">
      <p>Bitte drehen Sie Ihr Gerät, um das Spiel zu spielen.</p>
    </div> -->

    <div class="mobile-controls">
      <div class="left-controls">
        <div id="buttonLeft" class="playButtons"><</div>
        <div id="buttonRight" class="playButtons">></div>
      </div>
      <div class="right-controls">
        <div id="buttonJump" class="playButtons">J</div>
        <div id="buttonShoot" class="playButtons">S</div>
      </div>
    </div>
  </body>
</html>
